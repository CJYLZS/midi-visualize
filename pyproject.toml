[project]
name = "midi-visualize"
version = "0.1.0"
description = "Forward electric piano MIDI to a WS2812B strip via WLED"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "pyserial>=3.5",
    "python-rtmidi>=1.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midi_visualize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
